# Deploy — GitHub Pages
name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Validar variables de despliegue
        env:
          COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN || secrets.VITE_COGNITO_DOMAIN }}
          COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID || secrets.VITE_COGNITO_CLIENT_ID }}
          COGNITO_REDIRECT_URI: ${{ vars.VITE_COGNITO_REDIRECT_URI || secrets.VITE_COGNITO_REDIRECT_URI }}
          BFF_URL: ${{ vars.VITE_BFF_URL || secrets.VITE_BFF_URL }}
        run: |
          faltantes=()
          [ -z "$COGNITO_DOMAIN" ] && faltantes+=("VITE_COGNITO_DOMAIN")
          [ -z "$COGNITO_CLIENT_ID" ] && faltantes+=("VITE_COGNITO_CLIENT_ID")
          [ -z "$COGNITO_REDIRECT_URI" ] && faltantes+=("VITE_COGNITO_REDIRECT_URI")
          [ -z "$BFF_URL" ] && faltantes+=("VITE_BFF_URL")
          if [ ${#faltantes[@]} -ne 0 ]; then
            echo "::error::Variables de despliegue faltantes en GitHub Secrets/Variables: ${faltantes[*]}"
            exit 1
          fi

      - name: Build
        env:
          DEPLOY_BASE: ${{ github.event.repository.name }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN || secrets.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID || secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REDIRECT_URI: ${{ vars.VITE_COGNITO_REDIRECT_URI || secrets.VITE_COGNITO_REDIRECT_URI }}
          VITE_BFF_URL: ${{ vars.VITE_BFF_URL || secrets.VITE_BFF_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
