<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Convivo — plataforma de gestión para condominios y comunidades residenciales."
    />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cloud-native-convivo.github.io/Frontend-CloudNative/" />
    <meta property="og:title" content="Convivo | Gestión simple para condominios residenciales" />
    <meta property="og:description" content="Plataforma digital para condominios en Chile. Reservas, gastos, avisos y seguridad en comunidad." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1624204386084-dd8c05e32226?w=1200&h=630&fit=crop&auto=format" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:site_name" content="Convivo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Convivo | Gestión simple para condominios residenciales" />
    <meta name="twitter:description" content="Plataforma digital para condominios en Chile. Reservas, gastos, avisos y seguridad en comunidad." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1624204386084-dd8c05e32226?w=1200&h=630&fit=crop&auto=format" />
    
    <!-- CSP: Restringe orígenes de scripts, estilos, fuentes y restringe plugins/base -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; connect-src 'self' https: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; font-src 'self' data: https:; object-src 'none'; base-uri 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Core Web Vitals (LCP): Prerender public navigation links via Speculation Rules API -->
    <script type="speculationrules">
    {
      "prerender": [{
        "where": {
          "and": [
            { "href_matches": "/*" },
            { "not": { "href_matches": "/auth/*" } },
            { "not": { "href_matches": "/mi-dashboard*" } },
            { "not": { "href_matches": "/dashboard*" } },
            { "not": { "href_matches": "/completar-registro*" } }
          ]
        },
        "eagerness": "moderate"
      }]
    }
    </script>

    <link rel="canonical" href="https://cloud-native-convivo.github.io/Frontend-CloudNative/" />
    <title>Convivo | Gestión simple para condominios residenciales</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Convivo",
      "operatingSystem": "Web",
      "applicationCategory": "BusinessApplication",
      "description": "Plataforma digital para condominios en Chile. Reservas, gastos, avisos y seguridad.",
      "url": "https://cloud-native-convivo.github.io/Frontend-CloudNative"
    }
    </script>
    <script>
      // Contraparte de public/404.html — decodifica la ruta real antes de
      // que React Router monte. https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
